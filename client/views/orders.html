<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Velvet Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/orders.css">
</head>

<body>
    <header class="header">
        <div class="header-top" id="headerTop" style="display:none">
            <div class="container" style="max-width:1400px;padding:0 24px;">
                <p id="headerTopText"></p>
            </div>
        </div>
        <div class="header-main">
            <div class="container">
                <div class="header-wrapper">
                    <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <a href="/" class="logo">
                        <h1>VELVET</h1><span>ATELIER</span>
                    </a>
                    <nav class="nav-menu">
                        <ul>
                            <li><a href="/">Início</a></li>
                            <li><a href="/products">Coleção</a></li>
                            <li><a href="/products?category=novidades">Novidades</a></li>
                            <li><a href="/products?sale=true" style="color:#C45C5C;">Ofertas</a></li>
                        </ul>
                    </nav>
                    <div class="header-actions">
                        <div id="userMenuContainer"><a href="/login"><i class="fas fa-user"></i></a></div>
                        <a href="/cart" class="cart-btn"><i class="fas fa-shopping-bag"></i><span class="cart-count"
                                id="cartCount">0</span></a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="page-body" id="pageBody">
        <div class="container">
            <div class="page-heading">
                <h1>Meus Pedidos</h1>
                <p>Acompanhe e rastreie suas compras</p>
            </div>
            <div id="ordersList">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando pedidos...</div>
            </div>
        </div>
    </div>

    <div id="mobileOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:8000;"></div>
    <div id="mobileDrawer"
        style="display:none;position:fixed;top:0;left:0;width:72vw;max-width:280px;height:100vh;background:#fff;z-index:8001;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.2);flex-direction:column;">
        <div
            style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:#faf8f5;border-bottom:1px solid #f0ede9;">
            <span
                style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7355;">Menu</span>
            <button id="drawerClose"
                style="background:none;border:none;font-size:24px;cursor:pointer;color:#aaa;line-height:1;">&times;</button>
        </div>
        <nav id="drawerNav" style="flex:1;"></nav>
        <div style="border-top:2px solid #f0ede9;margin-top:auto;">
            <a href="/account"
                style="display:flex;align-items:center;gap:12px;padding:14px 24px;font-size:13px;color:#555;text-decoration:none;border-bottom:1px solid #f7f5f2;"><i
                    class="fas fa-user" style="color:#8B7355;width:16px;"></i> Minha Conta</a>
            <a href="/orders"
                style="display:flex;align-items:center;gap:12px;padding:14px 24px;font-size:13px;color:#8B7355;font-weight:600;text-decoration:none;border-bottom:1px solid #f7f5f2;"><i
                    class="fas fa-box" style="color:#8B7355;width:16px;"></i> Meus Pedidos</a>
            <a href="/ajuda"
                style="display:flex;align-items:center;gap:12px;padding:14px 24px;font-size:13px;color:#555;text-decoration:none;"><i
                    class="fas fa-question-circle" style="color:#8B7355;width:16px;"></i> Ajuda</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/cookies.js"></script>
    <div class="tracking-modal-overlay" id="trackingModalOverlay">
        <div class="tracking-modal">
            <button class="modal-x" onclick="closeTrackingModal()" aria-label="Fechar">&times;</button>
            <h3><i class="fas fa-truck" style="color:var(--primary);margin-right:8px;"></i>Rastrear Entrega</h3>
            <p>Use o código abaixo no site dos Correios para acompanhar sua entrega.</p>
            <div class="tracking-code-box">
                <span id="trackingCodeDisplay"></span>
                <button class="btn-copy" title="Copiar código" onclick="copyTrackingCode()"><i
                        class="fas fa-copy"></i></button>
            </div>
            <a id="trackingCorreiosLink" href="#" target="_blank" class="btn-correios">
                <i class="fas fa-external-link-alt" style="margin-right:6px;"></i>Abrir Correios
            </a>
            <button class="btn-modal-close" onclick="closeTrackingModal()">Fechar</button>
        </div>
    </div>

        <script src="/js/orders.page.js"></script>
</body>

</html>
