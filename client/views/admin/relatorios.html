<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Velvet Store Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/admin-auth.js"></script>
    <link rel="stylesheet" href="/css/admin-relatorios.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>VELVET</h2><span>administração</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/admin/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/admin/pedidos"><i class="fas fa-shopping-cart"></i> Pedidos</a></li>
            <li><a href="/admin/produtos"><i class="fas fa-box"></i> Produtos</a></li>
            <li><a href="/admin/categorias"><i class="fas fa-tags"></i> Categorias</a></li>
            <li><a href="/admin/clientes"><i class="fas fa-users"></i> Clientes</a></li>
            <li><a href="/admin/banners"><i class="fas fa-image"></i> Banners</a></li>
            <li><a href="/admin/cupons"><i class="fas fa-ticket-alt"></i> Cupons</a></li>
            <li><a href="/admin/alertas"><i class="fas fa-bell"></i> Alertas</a></li>
            <li><a href="/admin/relatorios" class="active"><i class="fas fa-chart-bar"></i> Relatórios</a></li>
            <li><a href="/admin/configuracoes"><i class="fas fa-cog"></i> Configurações</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-details">
                    <h4 id="adminName">Administrador</h4>
                    <p>Admin</p>
                </div>
            </div>
            <a href="/" target="_blank" class="logout-btn"
                style="margin-bottom:10px;background:rgba(255,255,255,0.07);"><i class="fas fa-store"
                    style="margin-right:10px;"></i> Ver loja</a>
            <a href="#" class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i>Sair</a>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="page-title">
                <h1>Relatórios</h1>
                <p>Análise de vendas e faturamento</p>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group"><label>De:</label><input type="date" id="startDate"></div>
            <div class="filter-group"><label>Até:</label><input type="date" id="endDate"></div>
            <button class="btn-primary" id="filterBtn"><i class="fas fa-filter"></i> Filtrar</button>
        </div>

        <div class="summary" id="summary"></div>
        <div class="report-table">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Pedidos</th>
                        <th>Faturamento</th>
                        <th>Ticket Médio</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="/js/admin-relatorios.page.js"></script>
</body>

</html>
