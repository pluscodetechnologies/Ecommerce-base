<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de E-mail | Velvet Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #8B7355; --dark: #1A1817; --light: #FDFCFB; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #fff; border-radius: 16px; padding: 48px 40px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 4px 32px rgba(0,0,0,0.08); }
        .icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; }
        .icon.loading { background: #f4f1ed; color: var(--primary); }
        .icon.success { background: #d4edda; color: #2E8B57; }
        .icon.error   { background: #f8d7da; color: #C45C5C; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin-bottom: 12px; }
        p { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 28px; }
        .btn { display: inline-block; padding: 14px 36px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; border: none; cursor: pointer; transition: background .2s; }
        .btn:hover { background: #6B5340; }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); margin-top: 10px; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; letter-spacing: 4px; color: var(--dark); margin-bottom: 40px; display: block; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <a href="/" class="logo">VELVET ATELIER</a>
        <div class="icon loading" id="icon"><i class="fas fa-spinner spinner" id="iconI"></i></div>
        <h1 id="title">Verificando seu e-mail...</h1>
        <p id="message">Aguarde um momento.</p>
        <div id="actions"></div>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token');

        async function verify() {
            if (!token) return showError('Link inválido. Acesse seu e-mail e clique no link correto.');
            try {
                const res  = await fetch(`/api/auth/verify-email?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('icon').className = 'icon success';
                    document.getElementById('iconI').className = 'fas fa-check';
                    document.getElementById('title').textContent = 'E-mail confirmado!';
                    document.getElementById('message').textContent = 'Sua conta está ativa. Agora você pode fazer login e aproveitar a Velvet Atelier.';
                    document.getElementById('actions').innerHTML = '<a href="/login" class="btn">Fazer Login</a>';
                } else {
                    showError(data.message);
                }
            } catch { showError('Erro de conexão. Tente novamente.'); }
        }

        function showError(msg) {
            document.getElementById('icon').className = 'icon error';
            document.getElementById('iconI').className = 'fas fa-times';
            document.getElementById('title').textContent = 'Link inválido ou expirado';
            document.getElementById('message').textContent = msg;
            document.getElementById('actions').innerHTML = `
                <a href="/login" class="btn">Ir para Login</a><br>
                <button class="btn btn-outline" style="margin-top:10px;width:100%;" onclick="resend()">Reenviar e-mail de verificação</button>
                <p id="resendMsg" style="margin-top:12px;font-size:12px;color:#2E8B57;display:none;"></p>`;
        }

        async function resend() {
            const email = prompt('Digite seu e-mail cadastrado:');
            if (!email) return;
            const res  = await fetch('/api/auth/resend-verification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            const msg  = document.getElementById('resendMsg');
            if (msg) { msg.textContent = data.message; msg.style.display = 'block'; }
        }

        verify();
    </script>
</body>
</html>
