<!-- 
    INSTRUÇÕES: No arquivo client/views/admin/pedidos.html,
    substitua o bloco <script> principal (que começa com "const user = JSON.parse...")
    pelo conteúdo abaixo.
    
    Mudanças:
    1. updateStatus: quando muda para "shipped", abre modal para inserir código de rastreamento
    2. Coluna Produtos: clicável, abre modal com itens detalhados do pedido
-->

<script>
    const user  = JSON.parse(localStorage.getItem('user') || '{}');
    const token = localStorage.getItem('token');

    if (!token || user.role !== 'admin') {
        window.location.href = '/admin';
    }

    document.getElementById('adminName').textContent = user.name || 'Administrador';
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/admin';
    });

    async function loadOrders(status = '') {
        try {
            const url = '/api/admin/orders?include_items=1' + (status ? `&status=${status}` : '');
            const response = await fetch(url, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const result = await response.json();

            if (result.success) {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = result.data.orders.map(order => {
                    const customerName = order.customer_name || 'Cliente';

                    let productNames = '<span style="color:#bbb;">—</span>';
                    if (order.items && order.items.length > 0) {
                        const preview = order.items.slice(0, 2)
                            .map(i => `${i.product_name}${i.quantity > 1 ? ' x' + i.quantity : ''}`)
                            .join(', ');
                        const extra = order.items.length > 2 ? ` +${order.items.length - 2}` : '';
                        productNames = `<span class="products-link" onclick="openProductsModal(${order.id})" 
                            style="cursor:pointer;color:#1976d2;text-decoration:underline;font-size:12px;" 
                            title="Clique para ver detalhes">${preview}${extra}</span>`;
                    }

                    const statusLabel = { pending: 'Pendente', paid: 'Pago', shipped: 'Enviado', delivered: 'Entregue', cancelled: 'Cancelado' };

                    return `
                        <tr>
                            <td>#${order.order_number}</td>
                            <td>${new Date(order.created_at).toLocaleDateString('pt-BR')}</td>
                            <td>${customerName}</td>
                            <td style="max-width:200px;">${productNames}</td>
                            <td>R$ ${parseFloat(order.total_amount).toFixed(2)}</td>
                            <td>${order.payment_method || '-'}</td>
                            <td>
                                <span class="status-badge status-${order.status}" id="badge-${order.id}">${statusLabel[order.status] || order.status}</span>
                                ${order.shipping_tracking ? `<div style="font-size:11px;color:#888;margin-top:4px;"><i class="fas fa-truck" style="margin-right:3px;"></i>${order.shipping_tracking}</div>` : ''}
                            </td>
                            <td>
                                <select class="status-change" onchange="updateStatus(${order.id}, this.value, this, '${order.customer_email || ''}', '${order.order_number}')" 
                                        style="padding:5px 10px;border-radius:5px;border:1px solid #ddd;">
                                    <option value="pending"   ${order.status === 'pending'   ? 'selected' : ''}>Pendente</option>
                                    <option value="paid"      ${order.status === 'paid'      ? 'selected' : ''}>Pago</option>
                                    <option value="shipped"   ${order.status === 'shipped'   ? 'selected' : ''}>Enviado</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Entregue</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        } catch (error) {
            console.error('Erro ao carregar pedidos:', error);
        }
    }

    const statusLabel = { pending: 'Pendente', paid: 'Pago', shipped: 'Enviado', delivered: 'Entregue', cancelled: 'Cancelado' };

    window.updateStatus = async function(orderId, status, selectEl, customerEmail, orderNumber) {
        // Se mudou para "Enviado", abre modal para código de rastreamento
        if (status === 'shipped') {
            openTrackingModal(orderId, status, selectEl, customerEmail, orderNumber);
            return;
        }
        await doUpdateStatus(orderId, status, null, selectEl);
    };

    async function doUpdateStatus(orderId, status, trackingCode, selectEl) {
        try {
            const body = { status };
            if (trackingCode) body.tracking_code = trackingCode;

            const res = await fetch(`/api/admin/orders/${orderId}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                const badge = document.getElementById(`badge-${orderId}`);
                if (badge) {
                    badge.className = `status-badge status-${status}`;
                    badge.textContent = statusLabel[status] || status;
                    if (trackingCode) {
                        badge.insertAdjacentHTML('afterend', 
                            `<div style="font-size:11px;color:#888;margin-top:4px;"><i class="fas fa-truck" style="margin-right:3px;"></i>${trackingCode}</div>`
                        );
                    }
                }
                if (selectEl) {
                    selectEl.style.borderColor = '#27ae60';
                    setTimeout(() => { selectEl.style.borderColor = ''; }, 1200);
                }
            }
        } catch (error) {
            console.error('Erro ao atualizar status:', error);
        }
    }

    // ── Modal de rastreamento ──────────────────────────────────────────────
    let _trackingData = {};

    function openTrackingModal(orderId, status, selectEl, customerEmail, orderNumber) {
        _trackingData = { orderId, status, selectEl, customerEmail, orderNumber };
        document.getElementById('trackingOrderNum').textContent = '#' + orderNumber;
        document.getElementById('trackingCodeInput').value = '';
        document.getElementById('trackingMsg').style.display = 'none';
        document.getElementById('trackingModal').classList.add('open');
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('trackingCodeInput').focus(), 100);
    }

    function closeTrackingModal() {
        document.getElementById('trackingModal').classList.remove('open');
        document.body.style.overflow = '';
        // Reverte o select se cancelou
        if (_trackingData.selectEl) {
            _trackingData.selectEl.value = 'paid'; // volta pro estado anterior (paid é o mais comum antes de shipped)
        }
    }

    window.confirmTracking = async function() {
        const trackingCode = document.getElementById('trackingCodeInput').value.trim().toUpperCase();
        const { orderId, status, selectEl } = _trackingData;

        await doUpdateStatus(orderId, status, trackingCode || null, selectEl);
        document.getElementById('trackingModal').classList.remove('open');
        document.body.style.overflow = '';
    };

    // ── Modal de produtos do pedido ────────────────────────────────────────
    window.openProductsModal = async function(orderId) {
        document.getElementById('productsModal').classList.add('open');
        document.body.style.overflow = 'hidden';
        document.getElementById('productsModalBody').innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Carregando...</p>';

        try {
            const res  = await fetch(`/api/admin/orders/${orderId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success && data.data.items) {
                const items = data.data.items;
                document.getElementById('productsModalTitle').textContent = `Pedido #${data.data.order_number}`;
                document.getElementById('productsModalBody').innerHTML = items.length ? `
                    <table style="width:100%;border-collapse:collapse;">
                        <thead>
                            <tr>
                                <th style="text-align:left;padding:10px 12px;font-size:12px;color:#666;border-bottom:1px solid #eee;">Produto</th>
                                <th style="text-align:center;padding:10px 12px;font-size:12px;color:#666;border-bottom:1px solid #eee;">Variações</th>
                                <th style="text-align:center;padding:10px 12px;font-size:12px;color:#666;border-bottom:1px solid #eee;">Qtd</th>
                                <th style="text-align:right;padding:10px 12px;font-size:12px;color:#666;border-bottom:1px solid #eee;">Preço Unit.</th>
                                <th style="text-align:right;padding:10px 12px;font-size:12px;color:#666;border-bottom:1px solid #eee;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(i => `
                                <tr>
                                    <td style="padding:12px;font-size:13px;font-weight:500;border-bottom:1px solid #f5f7fa;">${i.product_name}</td>
                                    <td style="padding:12px;font-size:12px;color:#888;text-align:center;border-bottom:1px solid #f5f7fa;">
                                        ${i.color ? `<span style="background:#f0ede8;padding:2px 8px;border-radius:4px;margin:2px;">${i.color}</span>` : ''}
                                        ${i.size  ? `<span style="background:#f0ede8;padding:2px 8px;border-radius:4px;margin:2px;">${i.size}</span>`  : ''}
                                        ${!i.color && !i.size ? '—' : ''}
                                    </td>
                                    <td style="padding:12px;text-align:center;font-size:13px;border-bottom:1px solid #f5f7fa;">${i.quantity}</td>
                                    <td style="padding:12px;text-align:right;font-size:13px;border-bottom:1px solid #f5f7fa;">R$ ${parseFloat(i.unit_price).toFixed(2)}</td>
                                    <td style="padding:12px;text-align:right;font-size:13px;font-weight:600;border-bottom:1px solid #f5f7fa;">R$ ${parseFloat(i.total_price).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                ` : '<p style="color:#999;text-align:center;padding:20px;">Nenhum item encontrado.</p>';
            }
        } catch {
            document.getElementById('productsModalBody').innerHTML = '<p style="color:#e74c3c;text-align:center;padding:20px;">Erro ao carregar itens.</p>';
        }
    };

    window.closeProductsModal = function() {
        document.getElementById('productsModal').classList.remove('open');
        document.body.style.overflow = '';
    };

    document.getElementById('statusFilter').addEventListener('change', (e) => {
        loadOrders(e.target.value);
    });

    loadOrders();
</script>

<!-- ═══ MODAL: CÓDIGO DE RASTREAMENTO ═══ -->
<div class="modal" id="trackingModal">
    <div class="modal-content" style="max-width:440px;">
        <div class="modal-header">
            <h3>Código de Rastreamento</h3>
            <button class="close-modal" onclick="closeTrackingModal()">&times;</button>
        </div>
        <p style="color:#666;font-size:14px;margin-bottom:20px;">
            Pedido <strong id="trackingOrderNum"></strong> será marcado como <strong>Enviado</strong>.
            Informe o código dos Correios para notificar o cliente por email.
        </p>
        <div id="trackingMsg" class="mo-msg-error"></div>
        <div class="form-group">
            <label>Código dos Correios <span style="color:#aaa;font-weight:400;">(opcional)</span></label>
            <input type="text" id="trackingCodeInput" placeholder="Ex: BR123456789BR" style="text-transform:uppercase;">
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
            <button onclick="closeTrackingModal()" style="padding:12px 20px;background:#f5f7fa;color:#555;border:2px solid #e0e0e0;border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;cursor:pointer;">Cancelar</button>
            <button onclick="confirmTracking()" class="btn-primary">
                <i class="fas fa-paper-plane"></i> Confirmar Envio
            </button>
        </div>
    </div>
</div>

<!-- ═══ MODAL: PRODUTOS DO PEDIDO ═══ -->
<div class="modal" id="productsModal">
    <div class="modal-content" style="max-width:680px;">
        <div class="modal-header">
            <h3 id="productsModalTitle">Itens do Pedido</h3>
            <button class="close-modal" onclick="closeProductsModal()">&times;</button>
        </div>
        <div id="productsModalBody"></div>
        <div style="display:flex;justify-content:flex-end;margin-top:20px;">
            <button onclick="closeProductsModal()" class="btn-primary">Fechar</button>
        </div>
    </div>
</div>
