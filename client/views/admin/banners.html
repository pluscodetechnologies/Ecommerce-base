<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banners - Velvet Store Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/admin-auth.js"></script>
    <link rel="stylesheet" href="/css/admin-banners.css">
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>VELVET</h2><span>administração</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/admin/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/admin/pedidos"><i class="fas fa-shopping-cart"></i> Pedidos</a></li>
            <li><a href="/admin/produtos"><i class="fas fa-box"></i> Produtos</a></li>
            <li><a href="/admin/categorias"><i class="fas fa-tags"></i> Categorias</a></li>
            <li><a href="/admin/clientes"><i class="fas fa-users"></i> Clientes</a></li>
            <li><a href="/admin/banners" class="active"><i class="fas fa-image"></i> Banners</a></li>
            <li><a href="/admin/cupons"><i class="fas fa-ticket-alt"></i> Cupons</a></li>
            <li><a href="/admin/alertas"><i class="fas fa-bell"></i> Alertas</a></li>
            <li><a href="/admin/relatorios"><i class="fas fa-chart-bar"></i> Relatórios</a></li>
            <li><a href="/admin/configuracoes"><i class="fas fa-cog"></i> Configurações</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-details">
                    <h4 id="adminName">Administrador</h4>
                    <p>Admin</p>
                </div>
            </div>
            <a href="/" target="_blank" class="logout-btn"
                style="margin-bottom:10px;background:rgba(255,255,255,0.07);"><i class="fas fa-store"
                    style="margin-right:10px;"></i> Ver loja</a>
            <a href="#" class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i>Sair</a>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="page-title">
                <h1>Banners</h1>
                <p>Gerencie os banners da página inicial</p>
            </div>
            <button class="btn-primary" id="newBannerBtn"><i class="fas fa-plus"></i>Novo Banner</button>
        </div>
        <div class="banners-list" id="bannersGrid"></div>
    </div>

    <div class="modal" id="bannerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Banner</h3><button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <form id="bannerForm">
                <input type="hidden" id="bannerId">
                <div class="form-group"><label>URL da Imagem</label><input type="text" id="bannerImage" required
                        placeholder="https://..."></div>
                <div class="form-group"><label>Título <span
                            style="font-size:11px;color:#aaa;font-weight:400;">(opcional)</span></label><input
                        type="text" id="bannerTitle" placeholder="Deixe em branco se não quiser"></div>
                <div class="form-group"><label>Subtítulo <span
                            style="font-size:11px;color:#aaa;font-weight:400;">(opcional)</span></label><input
                        type="text" id="bannerSubtitle" placeholder="Deixe em branco se não quiser"></div>

                <div class="form-group">
                    <label>Link ao clicar no banner</label>
                    <div class="link-type-tabs">
                        <button type="button" class="link-tab active" id="tabNone" onclick="setLinkTab('none')">Sem
                            link</button>
                        <button type="button" class="link-tab" id="tabProduct"
                            onclick="setLinkTab('product')">Produto</button>
                        <button type="button" class="link-tab" id="tabCustom" onclick="setLinkTab('custom')">URL
                            personalizada</button>
                    </div>

                    <div id="linkNone">
                        <p class="no-link-msg"><i class="fas fa-info-circle"></i> O banner não terá link ao ser clicado.
                        </p>
                    </div>

                    <div id="linkProduct" style="display:none;">
                        <div class="product-search-box">
                            <input type="text" class="product-search-input" id="productSearch"
                                placeholder="Buscar produto pelo nome..." autocomplete="off">
                            <div class="product-dropdown" id="productDropdown"></div>
                        </div>
                        <div id="productSelected" style="display:none;"></div>
                        <input type="hidden" id="selectedProductId">
                        <input type="hidden" id="selectedProductLink">
                    </div>

                    <div id="linkCustom" style="display:none;">
                        <input type="text" id="bannerLink" placeholder="Ex: /products?sale=true">
                    </div>
                </div>

                <div class="form-group"><label>Status</label><select id="bannerStatus">
                        <option value="1">Ativo</option>
                        <option value="0">Inativo</option>
                    </select></div>
                <button type="submit" class="btn-primary" style="width: 100%;">Salvar Banner</button>
            </form>
        </div>
    </div>
    <script src="/js/admin-banners.page.js"></script>
</body>

</html>
