<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Velvet Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8B7355; --dark: #1A1817; --light: #FDFCFB; --gray: #8B8581; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { text-align: center; max-width: 520px; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 5px; color: var(--dark); text-decoration: none; display: block; margin-bottom: 60px; opacity: .6; }
        .number { font-family: 'Cormorant Garamond', serif; font-size: 130px; font-weight: 600; line-height: 1; color: var(--dark); letter-spacing: -4px; margin-bottom: 8px; }
        .number span { color: var(--primary); }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; margin-bottom: 14px; }
        p { font-size: 14px; color: var(--gray); line-height: 1.7; margin-bottom: 40px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 13px 30px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none; border-radius: 2px; transition: all .2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #6B5340; }
        .btn-outline { border: 1.5px solid #ddd; color: var(--dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="logo">VELVET ATELIER</a>
        <div class="number">4<span>0</span>4</div>
        <h1>Página não encontrada</h1>
        <p>A página que você está procurando pode ter sido removida,<br>renomeada ou está temporariamente indisponível.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Ir para a Home</a>
            <a href="/products" class="btn btn-outline">Ver Coleção</a>
        </div>
    </div>
</body>
</html>
