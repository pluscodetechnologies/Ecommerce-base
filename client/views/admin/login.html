<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Velvet Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .admin-login-container { width: 100%; max-width: 420px; padding: 20px; }
        .admin-login-box { background: white; border-radius: 20px; padding: 50px 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .admin-logo { text-align: center; margin-bottom: 40px; }
        .admin-logo h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: #1a1a2e; letter-spacing: 4px; }
        .admin-logo span { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #666; }
        .admin-badge { display: inline-block; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 6px 20px; border-radius: 30px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 15px 18px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 15px; transition: all 0.3s ease; font-family: 'Poppins', sans-serif; }
        .form-group input:focus { outline: none; border-color: #1a1a2e; box-shadow: 0 0 0 3px rgba(26,26,46,0.1); }
        .password-input { position: relative; }
        .password-toggle { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #999; cursor: pointer; }
        .btn-login { width: 100%; padding: 15px; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; font-family: 'Poppins', sans-serif; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-login:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
        .error-message { background: #fee; color: #c0392b; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: none; }
        .back-to-site { text-align: center; margin-top: 20px; }
        .back-to-site a { color: #666; text-decoration: none; font-size: 14px; }
        .back-to-site a:hover { color: #1a1a2e; }
        .security-info { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; color: #999; font-size: 12px; }
        .security-info i { color: #27ae60; }
        .remember-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .remember-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #1a1a2e; cursor: pointer; }
        .remember-row label { font-size: 13px; color: #555; cursor: pointer; margin: 0; }
        #step2fa { display: none; }
        .totp-title { text-align: center; margin-bottom: 24px; }
        .totp-title i { font-size: 40px; color: #1a1a2e; display: block; margin-bottom: 12px; }
        .totp-title h3 { font-size: 18px; color: #1a1a2e; margin-bottom: 6px; }
        .totp-title p { font-size: 13px; color: #888; line-height: 1.6; }
        .totp-input { text-align: center; letter-spacing: 10px; font-size: 26px; font-weight: 700; padding: 16px !important; }
        .btn-back { background: none; border: none; color: #888; font-size: 13px; cursor: pointer; margin-top: 12px; font-family: 'Poppins', sans-serif; text-decoration: underline; display: block; margin-left: auto; margin-right: auto; }
        .btn-back:hover { color: #1a1a2e; }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-logo"><h1>VELVET</h1><span>store</span></div>
            <div style="text-align:center;">
                <span class="admin-badge"><i class="fas fa-lock" style="margin-right:8px;"></i>Área Administrativa</span>
            </div>

            <!-- PASSO 1: Login -->
            <div id="step1">
                <div id="errorMessage" class="error-message"></div>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="admin@velvetstore.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <div class="password-input">
                            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="remember-row">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Lembrar de mim por 30 dias</label>
                    </div>
                    <button type="submit" class="btn-login" id="loginBtn">
                        <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Acessar Painel
                    </button>
                </form>
            </div>

            <!-- PASSO 2: TOTP -->
            <div id="step2fa">
                <div class="totp-title">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>Verificação em 2 etapas</h3>
                    <p>Abra o Google Authenticator e digite o código de 6 dígitos gerado para Velvet Store.</p>
                </div>
                <div id="errorMessage2fa" class="error-message"></div>
                <div class="form-group">
                    <label>Código de verificação</label>
                    <input type="text" id="totpCode" class="totp-input" placeholder="000000" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
                </div>
                <button class="btn-login" id="verifyBtn" onclick="verifyTOTP()">
                    <i class="fas fa-check" style="margin-right:8px;"></i>Verificar
                </button>
                <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-left" style="margin-right:4px;"></i>Voltar ao login</button>
            </div>

            <div class="back-to-site">
                <a href="/"><i class="fas fa-arrow-left" style="margin-right:5px;"></i>Voltar para o site</a>
            </div>
            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                <span>Conexão segura — Acesso restrito a administradores</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const token = localStorage.getItem('token');
            const user  = JSON.parse(localStorage.getItem('user') || '{}');
            if (token && user.role === 'admin') {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    if (payload.exp * 1000 > Date.now()) window.location.href = '/admin/dashboard';
                } catch {}
            }
        })();

        document.querySelector('.password-toggle').addEventListener('click', function() {
            const input = this.parentElement.querySelector('input');
            const icon  = this.querySelector('i');
            input.type  = input.type === 'password' ? 'text' : 'password';
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        let _pendingToken = null;
        let _rememberMe   = false;

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn   = document.getElementById('loginBtn');
            const errEl = document.getElementById('errorMessage');
            errEl.style.display = 'none';
            btn.disabled  = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Entrando...';

            const formData  = new FormData(e.target);
            const data      = Object.fromEntries(formData.entries());
            data.rememberMe = document.getElementById('rememberMe').checked;
            _rememberMe     = data.rememberMe;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success && result.requires2FA) {
                    _pendingToken = result.pendingToken;
                    document.getElementById('step1').style.display  = 'none';
                    document.getElementById('step2fa').style.display = 'block';
                    setTimeout(() => document.getElementById('totpCode').focus(), 100);
                    return;
                }

                if (result.success) {
                    const user = result.data.user;
                    if (user.role !== 'admin') {
                        errEl.textContent = 'Acesso negado. Apenas administradores.';
                        errEl.style.display = 'block';
                        return;
                    }
                    localStorage.setItem('token',     result.data.token);
                    localStorage.setItem('authToken', result.data.token);
                    localStorage.setItem('user',      JSON.stringify(user));
                    window.location.href = '/admin/dashboard';
                } else {
                    let msg = result.message || 'Erro ao fazer login.';
                    if (Array.isArray(result.errors) && result.errors.length) msg = result.errors.map(e => e.message).join(' • ');
                    if (response.status === 429) msg = 'Muitas tentativas. Aguarde alguns minutos.';
                    errEl.textContent = msg; errEl.style.display = 'block';
                }
            } catch {
                errEl.textContent = 'Erro ao fazer login. Tente novamente.'; errEl.style.display = 'block';
            } finally {
                btn.disabled  = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Acessar Painel';
            }
        });

        async function verifyTOTP() {
            const code  = document.getElementById('totpCode').value.replace(/\D/g, '');
            const errEl = document.getElementById('errorMessage2fa');
            const btn   = document.getElementById('verifyBtn');
            errEl.style.display = 'none';

            if (code.length < 6) {
                errEl.textContent = 'Digite o código de 6 dígitos.'; errEl.style.display = 'block'; return;
            }

            btn.disabled  = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Verificando...';

            try {
                const res  = await fetch('/api/auth/2fa-login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ pendingToken: _pendingToken, code, rememberMe: _rememberMe })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token',     data.data.token);
                    localStorage.setItem('authToken', data.data.token);
                    localStorage.setItem('user',      JSON.stringify(data.data.user));
                    window.location.href = '/admin/dashboard';
                } else {
                    errEl.textContent = data.message || 'Código inválido.'; errEl.style.display = 'block';
                    document.getElementById('totpCode').value = ''; document.getElementById('totpCode').focus();
                }
            } catch {
                errEl.textContent = 'Erro de conexão.'; errEl.style.display = 'block';
            } finally {
                btn.disabled  = false;
                btn.innerHTML = '<i class="fas fa-check" style="margin-right:8px;"></i>Verificar';
            }
        }

        document.getElementById('totpCode').addEventListener('keydown', e => { if (e.key === 'Enter') verifyTOTP(); });
        document.getElementById('totpCode').addEventListener('input', function() {
            const v = this.value.replace(/\D/g, '');
            this.value = v;
            if (v.length === 6) verifyTOTP();
        });

        function goBack() {
            _pendingToken = null;
            document.getElementById('step2fa').style.display  = 'none';
            document.getElementById('step1').style.display    = 'block';
            document.getElementById('totpCode').value         = '';
            document.getElementById('errorMessage2fa').style.display = 'none';
        }
    </script>
</body>
</html>
