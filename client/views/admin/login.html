<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Velvet Store</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin-login.css">
</head>

<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <div class="admin-logo">
                <h1>VELVET</h1><span>store</span>
            </div>
            <div style="text-align:center;">
                <span class="admin-badge"><i class="fas fa-lock" style="margin-right:8px;"></i>Área
                    Administrativa</span>
            </div>

            <div id="step1">
                <div id="errorMessage" class="error-message"></div>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="admin@velvetstore.com" required
                            autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <div class="password-input">
                            <input type="password" name="password" placeholder="••••••••" required
                                autocomplete="current-password">
                            <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div class="remember-row">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">Lembrar de mim por 30 dias</label>
                    </div>
                    <button type="submit" class="btn-login" id="loginBtn">
                        <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Acessar Painel
                    </button>
                </form>
            </div>

            <div id="step2fa">
                <div class="totp-title">
                    <i class="fas fa-mobile-alt"></i>
                    <h3>Verificação em 2 etapas</h3>
                    <p>Abra o Google Authenticator e digite o código de 6 dígitos gerado para Velvet Store.</p>
                </div>
                <div id="errorMessage2fa" class="error-message"></div>
                <div class="form-group">
                    <label>Código de verificação</label>
                    <input type="text" id="totpCode" class="totp-input" placeholder="000000" maxlength="6"
                        autocomplete="one-time-code" inputmode="numeric">
                </div>
                <button class="btn-login" id="verifyBtn" onclick="verifyTOTP()">
                    <i class="fas fa-check" style="margin-right:8px;"></i>Verificar
                </button>
                <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-left"
                        style="margin-right:4px;"></i>Voltar ao login</button>
            </div>

            <div class="back-to-site">
                <a href="/"><i class="fas fa-arrow-left" style="margin-right:5px;"></i>Voltar para o site</a>
            </div>
            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                <span>Conexão segura — Acesso restrito a administradores</span>
            </div>
        </div>
    </div>
    <script src="/js/admin-login.page.js"></script>
</body>

</html>
