<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastrear Pedido | Velvet Atelier</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/rastreamento.css">
</head>

<body>

    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-name">VELVET</span>
                <span class="logo-sub">Atelier</span>
            </a>
            <a href="/products"
                style="color:rgba(255,255,255,0.6);font-size:13px;text-decoration:none;letter-spacing:1px;">
                <i class="fas fa-arrow-left" style="margin-right:6px;"></i> Continuar comprando
            </a>
        </div>
    </header>

    <div class="page">
        <h1 class="page-title">Rastrear Pedido</h1>
        <p class="page-subtitle">Digite o número do pedido e o email usado na compra para acompanhar a entrega.</p>

        <div class="search-card">
            <h2>Buscar Pedido</h2>
            <div class="search-grid">
                <div class="field">
                    <label>Número do Pedido</label>
                    <input type="text" id="orderInput" placeholder="Ex: VLT12345678" style="text-transform:uppercase;">
                </div>
                <div class="field">
                    <label>Email da Compra</label>
                    <input type="email" id="emailInput" placeholder="seu@email.com">
                </div>
            </div>
            <button class="btn-search" id="searchBtn" onclick="buscarPedido()">
                <i class="fas fa-search" style="margin-right:8px;"></i> Rastrear Pedido
            </button>
            <div class="msg-error" id="msgError"></div>
        </div>

        <div id="result"></div>
    </div>
    <script src="/js/rastreamento.page.js"></script>
</body>

</html>
