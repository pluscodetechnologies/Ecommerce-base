<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Velvet Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary:#8B7355; --primary-dark:#6B5340; --dark:#1A1817; --light:#FDFCFB; --gray:#8B8581; --border-light:#E8E4E0; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Montserrat',sans-serif; color:var(--dark); background:#f7f5f2; }
        .container { max-width:900px; margin:0 auto; padding:0 20px; }

        /* ── Header (igual ao index) ── */
        .header { position:fixed; top:0; left:0; width:100%; z-index:1000; background:rgba(253,252,251,0.98); border-bottom:1px solid var(--border-light); }
        .header-top { background:var(--dark); color:white; text-align:center; padding:8px 0; font-size:13px; }
        .header-main { position:relative; }
        .header-wrapper { display:flex; align-items:center; gap:20px; padding:0; }
        .header-main .container { max-width:1400px; padding:0 24px; }
        .logo { text-decoration:none; flex-shrink:0; }
        .logo h1 { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; letter-spacing:6px; color:var(--dark); }
        .logo span { font-size:11px; text-transform:uppercase; letter-spacing:4px; color:var(--primary); }
        .nav-menu { flex:1; position:static; }
        .nav-menu ul { display:flex; list-style:none; gap:36px; justify-content:center; }
        .nav-menu a { text-decoration:none; color:var(--dark); font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:1.5px; }
        .nav-menu a:hover { color:var(--primary); }
        .header-actions { display:flex; align-items:center; gap:20px; flex-shrink:0; }
        .header-actions a { background:none; border:none; font-size:20px; color:var(--dark); cursor:pointer; text-decoration:none; }
        .header-actions a:hover { color:var(--primary); }
        .cart-btn { position:relative; }
        .cart-count { position:absolute; top:-8px; right:-8px; background:var(--primary); color:white; font-size:10px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; }
        .mobile-menu-btn { display:none; }
        .user-menu { position:relative; display:inline-block; }
        .user-menu-btn { display:flex; align-items:center; gap:6px; background:none; border:none; font-size:13px; color:var(--dark); cursor:pointer; padding:6px 10px; border-radius:25px; transition:all .3s; }
        .user-menu-btn span { max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
        .user-menu-btn i { font-size:16px; }
        .user-dropdown { position:absolute; top:100%; right:0; background:white; border-radius:4px; box-shadow:0 5px 20px rgba(0,0,0,.15); min-width:200px; padding:10px 0; margin-top:10px; opacity:0; visibility:hidden; transition:opacity .2s,visibility .2s; z-index:1000; }
        .user-menu:hover .user-dropdown { opacity:1; visibility:visible; }
        .user-dropdown a { display:flex; align-items:center; gap:12px; padding:12px 18px; color:var(--dark); text-decoration:none; font-size:14px; }
        .user-dropdown a:hover { background:var(--light); color:var(--primary); }
        .user-dropdown .divider { height:1px; background:var(--border-light); margin:8px 0; }

        /* ── Page ── */
        .page-body { margin-top:0; padding:40px 0 60px; }
        .page-heading { margin-bottom:28px; }
        .page-heading h1 { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; margin-bottom:4px; }
        .page-heading p { font-size:13px; color:var(--gray); }

        /* ── Order card ── */
        .order-card { background:white; border-radius:8px; border:1px solid var(--border-light); margin-bottom:16px; overflow:hidden; }
        .order-header { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border-light); flex-wrap:wrap; gap:10px; }
        .order-number { font-weight:600; font-size:14px; color:var(--dark); }
        .order-date { font-size:12px; color:var(--gray); margin-top:2px; }
        .order-meta { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .order-total { font-size:15px; font-weight:600; color:var(--dark); }
        .status-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
        .status-paid       { background:#d4edda; color:#155724; }
        .status-processing { background:#d1ecf1; color:#0c5460; }
        .status-shipped    { background:#fff3cd; color:#856404; }
        .status-delivered  { background:#d4edda; color:#155724; }
        .status-cancelled  { background:#f8d7da; color:#721c24; }
        .status-pending    { background:#f8f9fa; color:#6c757d; }

        /* ── Items ── */
        .order-items { padding:0 22px; }
        .order-item { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid #f5f5f5; }
        .order-item:last-child { border-bottom:none; }
        .item-img { width:52px; height:65px; border-radius:4px; object-fit:cover; background:#f0ede9; flex-shrink:0; }
        .item-img-placeholder { width:52px; height:65px; border-radius:4px; background:#f0ede9; display:flex; align-items:center; justify-content:center; color:#ccc; flex-shrink:0; }
        .item-info { flex:1; min-width:0; }
        .item-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .item-qty  { font-size:12px; color:var(--gray); margin-top:2px; }
        .item-price { font-size:13px; font-weight:600; color:var(--dark); white-space:nowrap; }

        /* ── Footer actions ── */
        .order-footer { display:flex; justify-content:space-between; align-items:center; padding:14px 22px; background:#faf8f5; gap:10px; flex-wrap:wrap; }
        .order-shipping-info { font-size:12px; color:var(--gray); display:flex; align-items:center; gap:6px; }
        .order-shipping-info i { color:var(--primary); }
        .order-actions { display:flex; gap:10px; }
        .btn-track { display:inline-flex; align-items:center; gap:7px; padding:9px 18px; background:var(--primary); color:white; border:none; border-radius:4px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-decoration:none; transition:background .2s; }
        .btn-track:hover { background:var(--primary-dark); }
        .btn-track i { font-size:13px; }
        .btn-help { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; background:white; color:var(--dark); border:1.5px solid var(--border-light); border-radius:4px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:500; cursor:pointer; text-decoration:none; transition:all .2s; }
        .return-policy-note { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--gray); flex:1; }
        .return-policy-note i { color:var(--primary); flex-shrink:0; }
        .return-policy-note a { color:var(--primary); text-decoration:none; font-weight:600; white-space:nowrap; }
        .return-policy-note a:hover { text-decoration:underline; }
        .btn-help:hover { border-color:var(--primary); color:var(--primary); }

        /* ── Progress bar ── */
        .order-progress { padding:16px 22px 0; }
        .progress-steps { display:flex; align-items:flex-start; justify-content:space-between; position:relative; margin-bottom:12px; }
        .progress-steps::before { content:''; position:absolute; top:12px; left:0; right:0; height:2px; background:#e8e4e0; z-index:0; }
        .progress-line { position:absolute; top:12px; left:0; height:2px; background:var(--primary); z-index:1; transition:width .3s; }
        .step { display:flex; flex-direction:column; align-items:center; position:relative; z-index:2; flex:1; }
        .step-dot { width:24px; height:24px; border-radius:50%; border:2px solid #e8e4e0; background:white; display:flex; align-items:center; justify-content:center; font-size:10px; color:#ccc; margin-bottom:6px; transition:all .3s; }
        .step.done .step-dot { background:var(--primary); border-color:var(--primary); color:white; }
        .step.current .step-dot { background:white; border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 3px rgba(139,115,85,.15); }
        .step-label { font-size:10px; color:var(--gray); text-align:center; text-transform:uppercase; letter-spacing:.5px; line-height:1.3; }
        .step.done .step-label, .step.current .step-label { color:var(--dark); font-weight:600; }

        /* ── Empty / loading ── */
        .empty-state { text-align:center; padding:60px 20px; }
        .empty-state i { font-size:48px; color:#ddd; margin-bottom:16px; display:block; }
        .empty-state h2 { font-family:'Cormorant Garamond',serif; font-size:26px; margin-bottom:8px; }
        .empty-state p { color:var(--gray); font-size:14px; margin-bottom:24px; }
        .empty-state a { display:inline-block; padding:12px 28px; background:var(--primary); color:white; text-decoration:none; font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; border-radius:3px; }
        .empty-state a:hover { background:var(--primary-dark); }
        .loading { text-align:center; padding:40px; color:var(--gray); font-size:14px; }

        @media (max-width:600px) {
            .order-header { flex-direction:column; align-items:flex-start; }
            .order-meta { width:100%; justify-content:space-between; }
            .progress-steps { display:none; }
            .order-footer { flex-direction:column; align-items:flex-start; }
        }
        /* ── Modal Rastreamento ── */
        .tracking-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9000; align-items:center; justify-content:center; }
        .tracking-modal-overlay.open { display:flex; }
        .tracking-modal { background:#fff; border-radius:14px; padding:32px 28px; max-width:420px; width:90%; box-shadow:0 8px 40px rgba(0,0,0,0.18); position:relative; }
        .tracking-modal h3 { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; margin-bottom:6px; }
        .tracking-modal p { font-size:13px; color:var(--gray); margin-bottom:20px; }
        .tracking-code-box { display:flex; align-items:center; gap:10px; background:#f7f5f2; border:1.5px solid var(--border-light); border-radius:8px; padding:12px 16px; margin-bottom:20px; }
        .tracking-code-box span { flex:1; font-size:15px; font-weight:700; letter-spacing:2px; color:var(--dark); word-break:break-all; }
        .btn-copy { background:none; border:none; cursor:pointer; color:var(--primary); font-size:18px; padding:2px 4px; transition:opacity .2s; }
        .btn-copy:hover { opacity:.7; }
        .btn-correios { display:block; width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; letter-spacing:1px; cursor:pointer; text-align:center; text-decoration:none; transition:background .2s; margin-bottom:10px; }
        .btn-correios:hover { background:var(--primary-dark); }
        .btn-modal-close { display:block; width:100%; padding:11px; background:transparent; border:1.5px solid var(--border-light); border-radius:8px; font-family:'Montserrat',sans-serif; font-size:13px; cursor:pointer; color:var(--gray); transition:border-color .2s; }
        .btn-modal-close:hover { border-color:var(--gray); }
        .modal-x { position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--gray); line-height:1; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top" id="headerTop" style="display:none">
            <div class="container" style="max-width:1400px;padding:0 24px;">
                <p id="headerTopText"></p>
            </div>
        </div>
        <div class="header-main">
            <div class="container">
                <div class="header-wrapper">
                    <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <a href="/" class="logo"><h1>VELVET</h1><span>ATELIER</span></a>
                    <nav class="nav-menu">
                        <ul>
                            <li><a href="/">Início</a></li>
                            <li><a href="/products">Coleção</a></li>
                            <li><a href="/products?category=novidades">Novidades</a></li>
                            <li><a href="/products?sale=true" style="color:#C45C5C;">Ofertas</a></li>
                        </ul>
                    </nav>
                    <div class="header-actions">
                        <div id="userMenuContainer"><a href="/login"><i class="fas fa-user"></i></a></div>
                        <a href="/cart" class="cart-btn"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="page-body" id="pageBody">
        <div class="container">
            <div class="page-heading">
                <h1>Meus Pedidos</h1>
                <p>Acompanhe e rastreie suas compras</p>
            </div>
            <div id="ordersList"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando pedidos...</div></div>
        </div>
    </div>

    <!-- Mobile drawer -->
    <div id="mobileOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:8000;"></div>
    <div id="mobileDrawer" style="display:none;position:fixed;top:0;left:0;width:72vw;max-width:280px;height:100vh;background:#fff;z-index:8001;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.2);flex-direction:column;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:#faf8f5;border-bottom:1px solid #f0ede9;">
            <span style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8B7355;">Menu</span>
            <button id="drawerClose" style="background:none;border:none;font-size:24px;cursor:pointer;color:#aaa;line-height:1;">&times;</button>
        </div>
        <nav id="drawerNav" style="flex:1;"></nav>
        <div style="border-top:2px solid #f0ede9;margin-top:auto;">
            <a href="/account" style="display:flex;align-items:center;gap:12px;padding:14px 24px;font-size:13px;color:#555;text-decoration:none;border-bottom:1px solid #f7f5f2;"><i class="fas fa-user" style="color:#8B7355;width:16px;"></i> Minha Conta</a>
            <a href="/orders" style="display:flex;align-items:center;gap:12px;padding:14px 24px;font-size:13px;color:#8B7355;font-weight:600;text-decoration:none;border-bottom:1px solid #f7f5f2;"><i class="fas fa-box" style="color:#8B7355;width:16px;"></i> Meus Pedidos</a>
            <a href="/ajuda" style="display:flex;align-items:center;gap:12px;padding:14px 24px;font-size:13px;color:#555;text-decoration:none;"><i class="fas fa-question-circle" style="color:#8B7355;width:16px;"></i> Ajuda</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script>
    // Set header margin dynamically
    document.addEventListener('DOMContentLoaded', function() {
        var header = document.querySelector('.header');
        var body   = document.getElementById('pageBody');
        if (header && body) body.style.marginTop = header.offsetHeight + 'px';
    });

    // Header alert
    (async () => {
        try {
            const r = await fetch('/api/alerts');
            const d = await r.json();
            if (d.success && d.data.length && d.data.some(a => a.is_active)) {
                const a = d.data.find(x => x.is_active);
                const txt = (a.title ? a.title + ' — ' : '') + a.message;
                const el = document.getElementById('headerTopText');
                if (txt.length > 60) {
                    el.className = 'header-top-marquee';
                    el.innerHTML = `<div class="marquee-inner"><span>${txt}</span><span>${txt}</span></div>`;
                } else { el.textContent = txt; }
                document.getElementById('headerTop').style.display = '';
            }
        } catch {}
    })();

    // Status helpers
    const STATUS_LABELS = {
        pending:    'Pendente',
        paid:       'Pago',
        processing: 'Preparando',
        shipped:    'Enviado',
        delivered:  'Entregue',
        cancelled:  'Cancelado'
    };
    const STATUS_CLASS = {
        pending:    'status-pending',
        paid:       'status-paid',
        processing: 'status-processing',
        shipped:    'status-shipped',
        delivered:  'status-delivered',
        cancelled:  'status-cancelled'
    };

    // Progress steps per order status
    const STEPS = ['paid', 'processing', 'shipped', 'delivered'];
    const STEP_LABELS = ['Pago', 'Preparando', 'Enviado', 'Entregue'];

    function stepIndex(status) {
        const map = { paid:0, processing:1, shipped:2, delivered:3 };
        return map[status] ?? -1;
    }

    function buildProgress(status) {
        if (status === 'cancelled') return '';
        const cur = stepIndex(status);
        if (cur < 0) return '';
        const pct = cur === 0 ? 0 : Math.round((cur / (STEPS.length - 1)) * 100);
        const steps = STEPS.map((s, i) => {
            const done = i < cur;
            const current = i === cur;
            const cls = done ? 'step done' : current ? 'step current' : 'step';
            const icon = done ? '<i class="fas fa-check"></i>' : (i + 1);
            return `<div class="${cls}">
                <div class="step-dot">${icon}</div>
                <div class="step-label">${STEP_LABELS[i]}</div>
            </div>`;
        }).join('');

        return `<div class="order-progress">
            <div class="progress-steps">
                <div class="progress-line" style="width:${pct}%"></div>
                ${steps}
            </div>
        </div>`;
    }

    function formatDate(str) {
        const d = new Date(str);
        return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
    }
    function fmtMoney(v) { return 'R$ ' + parseFloat(v).toFixed(2).replace('.', ','); }

    function buildOrderCard(o) {
        const statusLabel = STATUS_LABELS[o.status] || o.status;
        const statusCls   = STATUS_CLASS[o.status]  || 'status-pending';
        const items = (o.items || []).map(i => `
            <div class="order-item">
                ${i.image
                    ? `<img src="${i.image}" class="item-img" alt="${i.product_name}">`
                    : `<div class="item-img-placeholder"><i class="fas fa-tshirt"></i></div>`}
                <div class="item-info">
                    <div class="item-name">${i.product_name}</div>
                    <div class="item-qty">Qtd: ${i.quantity}</div>
                </div>
                <div class="item-price">${fmtMoney(i.total_price)}</div>
            </div>`).join('');

        const trackingInfo = o.shipping_tracking
            ? `<div class="order-shipping-info"><i class="fas fa-barcode"></i> Código: <strong>${o.shipping_tracking}</strong></div>`
            : `<div class="order-shipping-info"><i class="fas fa-clock"></i> Código de rastreio será disponibilizado após o envio</div>`;

        const trackBtn = o.shipping_tracking
            ? `<button class="btn-track" onclick="openTrackingModal('${o.shipping_tracking}')"><i class="fas fa-search-location"></i> Rastrear Entrega</button>`
            : `<button class="btn-track" style="opacity:.5;cursor:not-allowed;" disabled><i class="fas fa-search-location"></i> Aguardando Envio</button>`;

        return `
        <div class="order-card">
            <div class="order-header">
                <div>
                    <div class="order-number">#${o.order_number}</div>
                    <div class="order-date">${formatDate(o.created_at)}</div>
                </div>
                <div class="order-meta">
                    <span class="order-total">${fmtMoney(o.total_amount)}</span>
                    <span class="status-pill ${statusCls}">${statusLabel}</span>
                </div>
            </div>
            ${buildProgress(o.status)}
            <div class="order-items">${items}</div>
            <div class="order-footer">
                ${trackingInfo}
                <div class="return-policy-note">
                    <i class="fas fa-undo-alt"></i>
                    <span>Você tem <strong>30 dias</strong> para troca ou devolução. <a href="/ajuda#troca" target="_blank">Saiba mais →</a></span>
                </div>
                <div class="order-actions">
                    ${trackBtn}
                    <a class="btn-help" href="/ajuda"><i class="fas fa-question-circle"></i> Ajuda</a>
                </div>
            </div>
        </div>`;
    }

    async function loadOrders() {
        const el = document.getElementById('ordersList');
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login?redirect=/orders';
                return;
            }
            const res = await fetch('/api/orders', {
                headers: { Authorization: 'Bearer ' + token }
            });
            const data = await res.json();

            if (!data.success) throw new Error(data.message);

            if (!data.data.length) {
                el.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h2>Nenhum pedido encontrado</h2>
                    <p>Quando você fizer uma compra, seus pedidos aparecerão aqui.</p>
                    <a href="/products">Explorar Coleção</a>
                </div>`;
                return;
            }

            el.innerHTML = data.data.map(buildOrderCard).join('');
        } catch (e) {
            console.error(e);
            el.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-circle" style="color:#e74c3c;"></i>
                <h2>Erro ao carregar pedidos</h2>
                <p>Por favor, tente novamente ou entre em contato com o suporte.</p>
                <a href="/ajuda">Central de Ajuda</a>
            </div>`;
        }
    }

    loadOrders();
    </script>

    <!-- Mobile drawer JS -->
    <script>
    (function() {
        var overlay  = document.getElementById('mobileOverlay');
        var drawer   = document.getElementById('mobileDrawer');
        var btn      = document.querySelector('.mobile-menu-btn');
        var closeBtn = document.getElementById('drawerClose');
        if (!btn) return;
        var navCopied = false;
        function copyNav() {
            if (navCopied) return; navCopied = true;
            var dn = document.getElementById('drawerNav');
            document.querySelectorAll('.nav-menu ul > li').forEach(function(li) {
                var a = li.querySelector('a'); if (!a) return;
                var l = document.createElement('a');
                l.href = a.href; l.textContent = a.textContent.trim();
                l.style.cssText = 'display:block;padding:16px 24px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:#1a1817;text-decoration:none;border-bottom:1px solid #f0ede9;';
                if (a.style.color) l.style.color = a.style.color;
                dn.appendChild(l);
            });
        }
        function open() { copyNav(); drawer.style.display='flex'; overlay.style.display='block'; document.body.style.overflow='hidden'; btn.innerHTML='<i class="fas fa-times"></i>'; }
        function close() { drawer.style.display='none'; overlay.style.display='none'; document.body.style.overflow=''; btn.innerHTML='<i class="fas fa-bars"></i>'; }
        btn.addEventListener('click', function(e) { e.stopPropagation(); if (window.innerWidth>768) return; drawer.style.display==='none'?open():close(); });
        overlay.addEventListener('click', close);
        closeBtn.addEventListener('click', close);
        window.addEventListener('resize', function() { if (window.innerWidth>768) close(); });
    })();
    </script>
    <script src="/js/cookies.js"></script>
    <!-- Modal Rastreamento -->
    <div class="tracking-modal-overlay" id="trackingModalOverlay">
        <div class="tracking-modal">
            <button class="modal-x" onclick="closeTrackingModal()" aria-label="Fechar">&times;</button>
            <h3><i class="fas fa-truck" style="color:var(--primary);margin-right:8px;"></i>Rastrear Entrega</h3>
            <p>Use o código abaixo no site dos Correios para acompanhar sua entrega.</p>
            <div class="tracking-code-box">
                <span id="trackingCodeDisplay"></span>
                <button class="btn-copy" title="Copiar código" onclick="copyTrackingCode()"><i class="fas fa-copy"></i></button>
            </div>
            <a id="trackingCorreiosLink" href="#" target="_blank" class="btn-correios">
                <i class="fas fa-external-link-alt" style="margin-right:6px;"></i>Abrir Correios
            </a>
            <button class="btn-modal-close" onclick="closeTrackingModal()">Fechar</button>
        </div>
    </div>

    <script>
        function openTrackingModal(code) {
            document.getElementById('trackingCodeDisplay').textContent = code;
            document.getElementById('trackingCorreiosLink').href =
                'https://rastreamento.correios.com.br/app/index.php?id=' + encodeURIComponent(code);
            document.getElementById('trackingModalOverlay').classList.add('open');
        }
        function closeTrackingModal() {
            document.getElementById('trackingModalOverlay').classList.remove('open');
        }
        function copyTrackingCode() {
            const code = document.getElementById('trackingCodeDisplay').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i>'; }, 1800);
            });
        }
        document.getElementById('trackingModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeTrackingModal();
        });
    </script>
