<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | Velvet Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Montserrat',sans-serif; background:linear-gradient(135deg,#fdf8f5 0%,#f5e6dc 100%); min-height:100vh; display:flex; flex-direction:column; }
        .header { background:#1A1817; padding:20px 30px; text-align:center; }
        .header a { text-decoration:none; }
        .header h1 { font-family:'Cormorant Garamond',serif; color:white; font-size:28px; letter-spacing:5px; }
        .header span { display:block; color:rgba(255,255,255,0.6); font-size:10px; letter-spacing:3px; text-transform:uppercase; }
        .content { flex:1; display:flex; align-items:center; justify-content:center; padding:60px 20px; }
        .box { background:white; border-radius:16px; box-shadow:0 20px 40px rgba(0,0,0,0.1); width:100%; max-width:440px; padding:40px; }
        .box-icon { width:60px; height:60px; background:#f7f0e8; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
        .box-icon i { font-size:24px; color:#8B7355; }
        .box h2 { font-family:'Cormorant Garamond',serif; font-size:26px; text-align:center; color:#1A1817; margin-bottom:8px; }
        .box p { font-size:13px; color:#8B8581; text-align:center; margin-bottom:28px; line-height:1.6; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:12px; font-weight:500; color:#555; margin-bottom:6px; letter-spacing:0.5px; text-transform:uppercase; }
        .password-wrap { position:relative; }
        .password-wrap input { width:100%; padding:12px 44px 12px 14px; border:1.5px solid #e8e4e0; border-radius:8px; font-family:'Montserrat',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s; }
        .password-wrap input:focus { border-color:#8B7355; }
        .password-wrap button { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#aaa; cursor:pointer; font-size:15px; }
        .hint { font-size:11px; color:#bbb; margin-top:5px; }
        .feedback { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:18px; display:none; }
        .feedback.success { background:#d4edda; color:#155724; }
        .feedback.error   { background:#f8d7da; color:#721c24; }
        .btn { width:100%; padding:13px; background:#1A1817; color:white; border:none; border-radius:8px; font-family:'Montserrat',sans-serif; font-size:14px; font-weight:600; letter-spacing:1px; cursor:pointer; transition:background 0.2s; margin-top:8px; }
        .btn:hover { background:#8B7355; }
        .back-link { text-align:center; margin-top:20px; font-size:13px; color:#8B8581; }
        .back-link a { color:#8B7355; text-decoration:none; font-weight:500; }
        footer { background:#1A1817; color:rgba(255,255,255,0.5); text-align:center; padding:20px; font-size:12px; letter-spacing:1px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/"><h1>VELVET</h1><span>Atelier</span></a>
    </div>

    <div class="content">
        <div class="box" id="resetBox">
            <div class="box-icon"><i class="fas fa-lock"></i></div>
            <h2>Nova Senha</h2>
            <p>Digite sua nova senha abaixo.<br>Escolha uma senha forte.</p>

            <div class="feedback" id="feedback"></div>

            <div class="form-group">
                <label>Nova senha</label>
                <div class="password-wrap">
                    <input type="password" id="newPassword" placeholder="••••••••">
                    <button type="button" onclick="toggleVis('newPassword',this)"><i class="fas fa-eye"></i></button>
                </div>
                <p class="hint">Mín. 8 caracteres, 1 maiúscula, 1 número e 1 símbolo (@$!%*?&)</p>
            </div>
            <div class="form-group">
                <label>Confirmar nova senha</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" placeholder="••••••••">
                    <button type="button" onclick="toggleVis('confirmPassword',this)"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <button class="btn" id="submitBtn" onclick="submitReset()">Redefinir Senha</button>
            <div class="back-link"><a href="/login">← Voltar para o login</a></div>
        </div>
    </div>

    <footer>© 2026 Velvet Atelier — Todos os direitos reservados</footer>

    <script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
        showFeedback('Link inválido ou expirado. Solicite um novo link de recuperação.', 'error');
        document.getElementById('submitBtn').style.display = 'none';
    }

    function toggleVis(id, btn) {
        const input = document.getElementById(id);
        const icon  = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    function showFeedback(msg, type) {
        const el = document.getElementById('feedback');
        el.textContent = msg;
        el.className = 'feedback ' + type;
        el.style.display = 'block';
    }

    async function submitReset() {
        const newPassword     = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');

        document.getElementById('feedback').style.display = 'none';

        if (!newPassword || !confirmPassword) {
            showFeedback('Preencha todos os campos.', 'error'); return;
        }
        if (newPassword !== confirmPassword) {
            showFeedback('As senhas não coincidem.', 'error'); return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
            const res  = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });
            const data = await res.json();
            if (data.success) {
                showFeedback('✅ Senha redefinida com sucesso! Redirecionando...', 'success');
                btn.style.display = 'none';
                setTimeout(() => window.location.href = '/login', 2500);
            } else {
                showFeedback(data.message || 'Erro ao redefinir senha.', 'error');
                btn.disabled = false;
                btn.textContent = 'Redefinir Senha';
            }
        } catch {
            showFeedback('Erro de conexão. Tente novamente.', 'error');
            btn.disabled = false;
            btn.textContent = 'Redefinir Senha';
        }
    }
    </script>
</body>
</html>
